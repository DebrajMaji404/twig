[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twig"
version = "0.1.0"
description = "Compact, token-efficient text encoding for nested JSON, for sending structured data to LLMs cheaply"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Debraj" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/twig"
Issues = "https://github.com/YOUR_USERNAME/twig/issues"

[tool.setuptools.packages.find]
include = ["twig*"]

[tool.vercel]
entrypoint = "web.api.index:app"
